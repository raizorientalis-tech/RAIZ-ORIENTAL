<p>Para el inicio del iPhone: Compartir → Agregar a inicio.</p>
<script>
  // Si se abrió desde el ícono del inicio, entra directo a la app.
  var standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  var desdeInicio = /[?&]inicio=1/.test(location.search);
  if (!desdeInicio) history.replaceState(null, '', location.pathname + '?inicio=1');
  if (standalone || desdeInicio) location.replace(document.getElementById('go').href);
</script>
